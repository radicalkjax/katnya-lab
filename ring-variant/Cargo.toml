[package]
name = "ring-variant"
version = "0.0.0"
edition = "2024"
publish = false

# Q-211: the same TLS/JWT stack as stack.md §3 but with ring instead of aws-lc-rs.
[dependencies]
rustls       = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest      = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "gzip", "charset", "system-proxy"] }
tokio        = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
octocrab     = { version = "=0.54.2", default-features = false, features = ["default-client", "rustls", "rustls-ring", "jwt-rust-crypto", "retry", "timeout", "tracing", "follow-redirect"] }
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
serde_json   = "=1.0.151"
anyhow       = "=1.0.104"
