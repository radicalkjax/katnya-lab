# Q-233 /dev/kvm availability
name: q233-kvm
on: workflow_dispatch
permissions: { contents: read }
jobs:
  kvm:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm] } }
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          k() { python3 -c "import os,fcntl;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION',fcntl.ioctl(fd,0xAE00))" 2>&1 | tail -1; }
          echo "LAB ${{ matrix.os }} image=$ImageVersion kernel=$(uname -r) cpu-virt=$(grep -Eoc 'vmx|svm' /proc/cpuinfo) user=$(id)"
          echo "LAB before: $(ls -l /dev/kvm 2>&1) :: $(k)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          echo "LAB after udev: $(ls -l /dev/kvm 2>&1) :: $(k)"
          A=${ANDROID_HOME:-/usr/local/lib/android/sdk}; E=$A/emulator/emulator; SM=$(ls $A/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "LAB ANDROID_HOME=$A sdkmanager=${SM:-none}"
          [ -x "$E" ] || [ -z "$SM" ] || yes | $SM --install emulator >/dev/null 2>&1 || true
          if [ -x "$E" ]; then echo "LAB emulator -accel-check: $($E -accel-check 2>&1 | tr '\n' ' ' | cut -c1-200)"; else echo "LAB no Android emulator in image ($E)"; fi
