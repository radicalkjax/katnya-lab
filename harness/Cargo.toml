[package]
name = "stack-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
clap            = { version = "=4.6.7", features = ["derive", "env", "wrap_help"] }
serde           = { version = "=1.0.229", features = ["derive"] }
serde_json      = "=1.0.151"
serde-saphyr    = "=1.3.0"
toml            = "=1.1.6"
toml_edit       = "=0.25.15"
jsonschema      = { version = "=0.57.0", default-features = false }
serde-sarif     = "=0.8.0"
schemars        = "=1.2.2"
gix             = { version = "=0.87.1", default-features = false, features = ["basic", "sha1", "max-performance-safe", "merge", "notes"] }
ast-grep-core   = "=0.45.3"
ast-grep-language = { version = "=0.45.3", default-features = false, features = ["tree-sitter-rust","tree-sitter-typescript","tree-sitter-javascript","tree-sitter-swift","tree-sitter-python","tree-sitter-go","tree-sitter-kotlin","tree-sitter-java","tree-sitter-c","tree-sitter-cpp","tree-sitter-dart","tree-sitter-c-sharp"] }
tree-sitter     = "=0.27.0"
syn             = { version = "=3.0.6", features = ["full", "visit", "extra-traits"] }
proc-macro2     = { version = "=1.0.107", features = ["span-locations"] }
cargo_metadata  = "=0.23.1"
cargo-lock      = "=11.1.0"
semver          = { version = "=1.0.28", features = ["serde"] }
packageurl      = "=0.7.1"
reqwest         = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "gzip", "charset", "system-proxy"] }
tokio           = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-std", "signal", "time", "net", "sync"] }
axum            = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
octocrab        = { version = "=0.54.2", default-features = false, features = ["default-client", "rustls", "rustls-aws-lc-rs", "jwt-aws-lc-rs", "retry", "timeout", "tracing", "follow-redirect"] }
jsonwebtoken    = { version = "=10.4.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
rmcp            = { version = "=3.4.0", features = ["server", "client", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
sigstore-verify = "=0.11.0"
sha2            = "=0.11.0"
blake3          = "=1.8.7"
hex             = "=0.4.3"
keyring         = "=4.2.0"
camino          = { version = "=1.2.6", features = ["serde1"] }
tempfile        = "=3.27.0"
ignore          = "=0.4.33"
globset         = "=0.4.20"
regex           = "=1.13.1"
similar         = "=3.2.0"
jiff            = { version = "=0.2.37", features = ["serde"] }
tracing         = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
opentelemetry   = "=0.33.0"
opentelemetry_sdk = { version = "=0.33.0", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["http-proto", "reqwest-rustls", "reqwest-client", "logs", "trace"] }
opentelemetry-appender-tracing = "=0.33.0"
thiserror       = "=2.0.20"
anyhow          = "=1.0.104"

[dev-dependencies]
insta           = { version = "=1.48.0", features = ["json", "yaml", "redactions"] }
assert_cmd      = "=2.2.2"
predicates      = "=3.1.4"
proptest        = "=1.11.0"
