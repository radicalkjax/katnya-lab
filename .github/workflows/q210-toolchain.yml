# Q-210 (S0) toolchain parity on 8 targets + Q-211 (S8) aws-lc-sys vs ring
name: q210-toolchain
on: workflow_dispatch
permissions: { contents: read }
env: { RUST: 1.98.1, CARGO_TERM_COLOR: never }
jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-2025,     target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc }
          - { os: macos-15,         target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - name: rustup (install if absent)
        run: |
          if ! command -v rustup >/dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              curl -fsSLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe"
              ./rustup-init.exe -y --profile minimal --default-toolchain none; echo "$USERPROFILE/.cargo/bin" >> $GITHUB_PATH
            else curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; echo "$HOME/.cargo/bin" >> $GITHUB_PATH; fi
            echo "LAB rustup was absent; installed"
          fi
      - run: |
          rustup toolchain install $RUST --profile minimal --target ${{ matrix.target }}
          rustup default $RUST
          echo "LAB image=$ImageOS/$ImageVersion arch=$RUNNER_ARCH os=${{ matrix.os }} target=${{ matrix.target }}"
          rustc -vV | sed 's/^/LAB /'
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools >/dev/null && echo "LAB musl-gcc=$(command -v musl-gcc)"
      - name: cargo check
        working-directory: harness
        run: cargo check --locked --all-targets --target ${{ matrix.target }} && echo "LAB RESULT check=PASS"
      - name: cargo test
        working-directory: harness
        run: |
          cargo test --locked --target ${{ matrix.target }} 2>&1 | tee t.log | grep -E "test result|FAILED|panicked" | sed 's/^/LAB /'
          test ${PIPESTATUS[0]} -eq 0 && echo "LAB RESULT test=PASS"
      - name: aws-lc-sys present?
        working-directory: harness
        run: |
          cargo tree --locked --target ${{ matrix.target }} -i aws-lc-sys -e normal --depth 1 | head -3 | sed 's/^/LAB /'
          ls -d target/${{ matrix.target }}/debug/build/aws-lc-sys-*/out 2>/dev/null | head -1 | sed 's/^/LAB built /' || true
      - name: ring variant (Q-211)
        if: always()
        working-directory: ring-variant
        run: |
          cargo run --locked --target ${{ matrix.target }} 2>&1 | tail -1 | sed 's/^/LAB /'
          echo "LAB ring aws-lc-sys: $(cargo tree --target ${{ matrix.target }} -i aws-lc-sys 2>&1 | head -1)"
